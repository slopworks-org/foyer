# Pushing a tag `vX.Y.Z` builds a signed APK and publishes it as a GitHub
# release. The tag must match `versionName` in app/build.gradle.kts.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Without the secrets the build would fall back to the debug key, and
      # an APK signed with it could never be updated by a later release.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FOYER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret FOYER_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FOYER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          FOYER_KEYSTORE_PASSWORD: ${{ secrets.FOYER_KEYSTORE_PASSWORD }}
          FOYER_KEY_ALIAS: ${{ secrets.FOYER_KEY_ALIAS }}
          FOYER_KEY_PASSWORD: ${{ secrets.FOYER_KEYSTORE_PASSWORD }}
        run: ./gradlew check :app:assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="foyer-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Foyer $VERSION" --generate-notes
